[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Redirects for backwards-compatibility with legacy Jekyll URLs (.html -> clean URL)
[[redirects]]
  from = "/:category/:year/:month/:day/:slug.html"
  to = "/:category/:year/:month/:day/:slug"
  status = 301

[[redirects]]
  from = "/categories/:category.html"
  to = "/categories/:category"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/rss.xml"
  to = "/feed.xml"
  status = 301

# HTTP Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
